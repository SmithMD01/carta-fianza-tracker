services:
  db:
    image: postgres:18
    container_name: carta-fianza-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - carta_fianza_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carta_user -d carta_fianza"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carta_fianza_data: